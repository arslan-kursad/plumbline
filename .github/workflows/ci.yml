name: ci

# pull_request, never `pull_request[_]target` — written in this repository's
# self-non-matching notation (ADR-0004 §4) because Gate D scans this file. That
# trigger runs with repository write permissions against untrusted fork code, and
# Gate D fails the build if it ever appears in a workflow file (F0 spec §W6.1).
on:
  push:
    branches: [main]
  pull_request:
  # Manual full run, for when a job needs re-running without a commit to force it.
  workflow_dispatch:

# Read-only by default. The single job that authenticates to GCP raises its own
# permissions and nothing else can.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.filter.outputs.collector }}
      images: ${{ steps.filter.outputs.images }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      killswitch: ${{ steps.filter.outputs.killswitch }}
      terraform: ${{ steps.filter.outputs.terraform }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Path filtering applies to pull requests only. On main every job
          # runs, so "green on main" means every job actually ran and passed —
          # with filtering there too, a job whose configuration is broken stays
          # skipped and green until the phase that finally touches its
          # directory (F0 spec §W6.3).
          #
          # Any doubt about what changed also means everything runs. A filter
          # that guesses wrong silently skips the job that would have caught the
          # defect, so its failure mode has to be "too much CI", never "too
          # little".
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            range="origin/${BASE_REF}...HEAD"
          fi

          if [ -n "$range" ]; then
            files="$(git diff --name-only "$range")"
          else
            files=""
            echo "no usable diff range; running every job"
          fi

          match() {
            if [ -z "$range" ]; then
              echo true
              return
            fi
            if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }

          {
            # testdata/ carries the fixture corpus the collector's splitter and
            # byte-identity tests run against, so a fixture change is a change to
            # what those tests assert.
            echo "collector=$(match '^(collector|testdata)/')"
            # testdata/ and third_party/ are inputs to the .NET test suite: the
            # fixture corpus and the vendored OTLP protos. normalization/ holds the
            # mapping and redaction YAML embedded into the worker at build. A change to
            # any of them is a change to what those tests assert, so the job that runs
            # them has to be in scope or it stays skipped and green while the thing it
            # checks moves.
            echo "dotnet=$(match '^(worker|analytics|normalization|testdata|third_party)/')"
            echo "killswitch=$(match '^infra/functions/')"
            # Everything that ends up inside an image, plus the Dockerfiles themselves.
            # The worker image is built from the repository root because it embeds the
            # mapping YAML, so normalization/ and third_party/ are its inputs too.
            echo "images=$(match '^(collector/|worker/|normalization/|third_party/|\.github/workflows/ci\.yml)')"
            # The plan guard parses architecture §7.1, so a change to that
            # document is a change to the control. analytics/sql/ is in scope for
            # the same reason one level down: the BigQuery table schema is
            # generated from 001_spans_table.sql and the view bodies are read out
            # of the other two at plan time, so a change there is a change to what
            # Terraform builds — and the schema guard that catches the mismatch
            # would otherwise stay skipped in exactly the commit that introduced
            # one.
            echo "terraform=$(match '^(infra/terraform/|scripts/ci/|docs/architecture\.md|analytics/sql/)')"
            # The end-to-end run exercises the collector, the worker, the mappings, the
            # fixtures, the SQL and the compose stack, so a change to any of them is a
            # change to what it proves.
            echo "e2e=$(match '^(collector/|worker/|normalization/|testdata/|third_party/|analytics/sql/|scripts/e2e/|docker-compose\.yml|Makefile)')"
          } >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"

  gates:
    name: invariant gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The fixture-provenance gate asks what this change touched, which
          # needs a merge base. A shallow checkout has none, and the gate would
          # then see "nothing changed" and pass over a new hand-authored fixture
          # — the exact case it exists to refuse.
          fetch-depth: 0

      - name: Gates A-E
        run: ./scripts/ci/invariant-gates.sh

      # A gate verified only against a clean tree is unverified (F0 spec §6).
      # Running the proofs on every build keeps that true as the gates change,
      # which a one-time manual demonstration cannot.
      # The deploy path's guards are proven here rather than in the path-filtered
      # terraform job: they protect an apply, so their proof runs on every CI run
      # regardless of what the change touched.
      - name: Environment guard self-test
        run: ./scripts/ci/environment-guard.sh --self-test

      # Also a deploy-path guard, so it is proven here rather than in the
      # path-filtered terraform job: it decides whether a wave can be armed.
      - name: Empty-plan guard self-test
        run: ./scripts/ci/plan-nonempty-guard.sh --self-test

      # Non-blocking, and the two halves are deliberately split. The self-test gates:
      # a checker that cannot fail on a known-bad corpus is not evidence, so it runs
      # with the other proofs and breaks the build if the corpus stops behaving.
      # The scan over docs/ does not gate — it reports. Flipping it to blocking changes
      # what CI asserts and is a separate decision (F3 entry directive, F3E-04).
      - name: Cross-reference check self-test
        run: ./scripts/ci/xref-check.sh --self-test

      # The capture harness cannot be run in CI — a capture needs a real agent and a
      # human. What CI can hold is that its two checks still discriminate: the manifest
      # validator accepts a complete captured manifest and rejects both a manifest
      # missing a row-1.2 field and the hand-authored corpus, and the redaction gate
      # refuses a payload no rule file accounts for. A validator that only ever refuses,
      # or only ever passes, has not been tested.
      - name: Capture harness self-test
        run: ./scripts/capture/capture.sh --self-test

      # Same reasoning: the capture itself needs a human and an authenticated Claude
      # Code, so what CI holds is that the pre-flight refuses a bad environment and the
      # report names each terminal state — including the one anchored to the real corpus
      # payload, which is the boundary every attempt so far has hit.
      - name: Claude Code capture diagnostics self-test
        run: ./scripts/capture/claude-code-preflight.sh --self-test

      - name: Cross-reference scan (non-blocking)
        run: |
          mkdir -p artifacts
          ./scripts/ci/xref-check.sh --json artifacts/xref-findings.json | tee artifacts/xref-findings.txt

      - name: Upload cross-reference findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xref-findings
          path: artifacts/xref-findings.*
          if-no-files-found: warn

      # Guard fixtures are derived from real plan output, never authored
      # (scripts/ci/testdata/README.md). The gate holds the rule; the self-test
      # proves the gate can refuse each way it is meant to.
      - name: Fixture provenance gate
        run: ./scripts/ci/fixture-provenance-guard.sh

      - name: Fixture provenance self-test
        run: ./scripts/ci/fixture-provenance-guard.sh --self-test

      - name: Scrub tool tests
        run: python3 scripts/ci/scrub_plan_test.py

      # The readout is the only tool here that talks to the cloud, so its
      # self-test deliberately does not: it exercises the read-only guard and the
      # redaction rules, both of which are what make the tool safe to point at a
      # live project and safe to archive in a public repository.
      - name: State readout self-test
        run: ./scripts/state-readout.sh --self-test

      # The seeder's comment stripper needs no containers, so it is checked here
      # rather than only inside the end-to-end job: a unit failure should not have
      # to wait for a stack to come up to be seen.
      - name: Seeder tests
        run: python3 scripts/e2e/seed_test.py

      # The cloud harness's guards, none of which touch the cloud. The arming guard in
      # particular is what stands between an accidental invocation and the DoD 7b exam,
      # so it is checked on every commit rather than only when someone runs the harness.
      - name: Cloud harness guard tests
        run: python3 scripts/e2e/cloud_test.py

      # The dedup probe's verdict, which is the part carrying the judgement. It needs
      # no containers either, and its cases are one per way a dedup view can be wrong
      # -- including the way that used to be invisible, an absent duplicate reported as
      # a pass.
      - name: Dedup probe verdict tests
        run: python3 scripts/e2e/dedup_probe_test.py

      - name: Prove every gate can fail
        run: ./scripts/ci/prove-gates.sh

  collector:
    name: collector (go)
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - run: go build ./...
        working-directory: collector
      - run: go vet ./...
        working-directory: collector
      # -race because the collector is concurrent by construction: two listeners,
      # a shared rate limiter, and a publisher called from both.
      - run: go test -race ./...
        working-directory: collector

  killswitch:
    name: kill-switch function (go)
    needs: changes
    if: needs.changes.outputs.killswitch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infra/functions/billing-killswitch/go.mod
          cache-dependency-path: infra/functions/billing-killswitch/go.sum
      - run: go build ./...
        working-directory: infra/functions/billing-killswitch
      - run: go vet ./...
        working-directory: infra/functions/billing-killswitch
      - run: go test ./...
        working-directory: infra/functions/billing-killswitch

  dotnet:
    name: worker and analytics (.net)
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build worker/Plumbline.Worker.sln --nologo
      - run: dotnet build analytics/Plumbline.Analytics.sln --nologo

      # Tests, not only compilation. The fixture corpus, its integrity checks and the
      # golden-file suite all live in the worker solution; a suite CI does not run is
      # advisory, which is the state F1 W2 ends.
      - run: dotnet test worker/Plumbline.Worker.sln --nologo --no-build

  terraform:
    name: terraform static checks
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive infra/terraform

      - name: Validate root module
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap module
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Proves the plan guard rejects what it claims to reject, against fixtures
      # rather than against a live plan — the same reasoning as the gate proofs.
      - name: Plan guard self-test
        run: ./scripts/ci/terraform-plan-guard.sh --self-test

      # The generated BigQuery schema against the DDL it came from, and the guard
      # itself against fixtures that violate it.
      - name: Schema guard
        run: ./scripts/ci/bq-schema-guard.sh

      - name: Schema guard self-test
        run: ./scripts/ci/bq-schema-guard.sh --self-test

  terraform-plan:
    name: terraform plan (wif)
    needs: [changes, terraform]
    # Inert until the GCP project exists and the repository variables are set,
    # so this job skips instead of failing the branch. A skipped job is not
    # evidence of anything: F0 acceptance criterion 8 is satisfied by an
    # authenticated run, and the F0 completion note records which one.
    if: >-
      needs.changes.outputs.terraform == 'true' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Workload Identity Federation: a short-lived token minted from the
      # workflow's OIDC assertion. No exported service account key exists to
      # leak (architecture §6.1, F0 spec §W6.1).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Plan
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
          terraform plan -input=false -lock=false -out=plan.tfplan

      - name: Plan guard
        run: ./scripts/ci/terraform-plan-guard.sh infra/terraform/plan.tfplan

  # Images are built on every pull request and pushed only from main.
  #
  # The split is not a convention, it is the identity model: `ci-deploy` is bound to
  # `attribute.ref/refs/heads/main`, so a pull request cannot obtain a token that can
  # write to Artifact Registry even if this job asked for one. The `if` below states the
  # rule; Google enforces it.
  images:
    name: images (distroless)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Build first, always, with no credentials in scope. A build that only happens
      # behind an authentication step is a build whose failures look like auth failures.
      - name: Build the collector image
        run: docker build -t collector:${{ github.sha }} ./collector

      - name: Build the worker image
        run: docker build -t worker:${{ github.sha }} -f worker/Dockerfile .

      # The images must be what §8 claims they are. Asserted rather than trusted: a base
      # image swapped for a convenient one during debugging is the kind of change that
      # merges quietly and is discovered when someone asks why the image is 900 MB.
      - name: Assert both images are distroless
        run: |
          fail=0
          for image in collector:${{ github.sha }} worker:${{ github.sha }}; do
            if docker run --rm --entrypoint sh "$image" -c 'echo reachable' 2>/dev/null; then
              echo "::error::$image has a shell; it is not distroless"
              fail=1
            else
              echo "$image: no shell"
            fi
          done
          exit $fail

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Push to Artifact Registry
        if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
        env:
          REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/plumbline
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

          # Tagged by commit only. No `latest`: a moving tag makes "which image is
          # running" a question with no answer, and Cloud Run pins a digest anyway.
          for component in collector worker; do
            docker tag "${component}:${{ github.sha }}" "${REGISTRY}/${component}:${{ github.sha }}"
            docker push "${REGISTRY}/${component}:${{ github.sha }}"
          done

  e2e:
    name: local end-to-end
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Two emulators, two built images and a full pipeline. The step timings are in
    # docs/runbooks/local-dev.md; the ceiling is here so a hang fails rather than
    # occupying a runner until the job limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      # Runs on every pull request rather than on main only. The measured runtime is
      # recorded in the F1 decision log (W6.4) alongside the reasoning: this job is the
      # only place the compose path is exercised at all, since the phase's development
      # host cannot run containers, and a check that runs after the merge reports a
      # regression to nobody in a position to fix it cheaply.
      - name: make e2e
        run: make e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile tools logs --tail 200

  # Single required status check. Path-filtered jobs report "skipped" when they
  # do not apply, and branch protection cannot distinguish "skipped" from "never
  # started"; aggregating here means a required check exists on every run
  # without any job being required to run on every run (runbook:
  # docs/runbooks/branch-protection.md).
  ci-complete:
    name: ci complete
    if: always()
    needs: [gates, collector, killswitch, dotnet, terraform, terraform-plan, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a job reported '$result'"; exit 1 ;;
            esac
          done
          echo "all jobs succeeded or were skipped"
